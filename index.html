
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duty Roster Maker | Bangladesh Shishu Hospital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .print-container {
                width: 100% !important;
                max-width: none !important;
                padding: 0 !important;
                border: none !important;
            }
            table {
                border-collapse: collapse !important;
                width: 100% !important;
                page-break-inside: auto;
            }
            tr {
                page-break-inside: avoid;
                page-break-after: auto;
            }
            th, td {
                border: 1px solid black !important;
            }
        }
        @page {
            size: landscape;
            margin: 0.5cm;
        }
        
        /* Modern Scrollbars */
        .scrollbar-thin::-webkit-scrollbar {
            height: 6px;
        }
        .scrollbar-thin::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .roster-table th, .roster-table td {
            padding: 4px;
            text-align: center;
            font-size: 0.7rem;
            line-height: 1.1;
            border: 1px solid #333;
        }
        .employee-summary-table th, .employee-summary-table td {
            padding: 2px 4px;
            font-size: 0.65rem;
            border: 1px solid #333;
        }
        
        /* Ensure inputs look clean on mobile and have black font */
        input:focus {
            background-color: #f0fdf4; /* Very light green background on focus */
            color: black !important;
        }
    </style>
